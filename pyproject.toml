[project]
name = "bertlda"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Jean Vides", email = "videsrudas@proton.me" }
]
requires-python = ">=3.13"
dependencies = [
    "gensim>=4.4.0",
    "geopandas>=1.2.0",
    "matplotlib>=3.11.2",
    "nltk>=3.10.4",
    "numpy>=2.5.4",
    "openpyxl>=3.1.5",
    "pandas>=3.1.0",
    "pycountry>=26.2.16",
    "pyldavis>=3.4.1",
    "scikit-learn>=1.9",
    "statsmodels>=0.15.0",
    "wordcloud>=1.9.6",
]

[project.scripts]
bertlda = "bertlda:main"

[build-system]
requires = ["uv_build>=0.12.18,<0.13.0"]
build-backend = "uv_build"
